spring.application.name=syllabus-tracker-backend
server.port=${PORT:4000}

# ---- Database ---------------------------------------------------------
# File-based H2 database (replaces the original SQLite file). AUTO_SERVER
# lets a second local process connect to the same file if needed.
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/authdb};AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ---- Google Sign-In -----------------------------------------------------
# Same client ID configured on the frontend (VITE_GOOGLE_CLIENT_ID). Google
# ID tokens are verified against this audience. Leave blank to disable
# Google sign-in on the backend (the /api/google-login endpoint will 500
# with a clear message instead of accepting unverified tokens).
google.client-id=${GOOGLE_CLIENT_ID:}

# ---- AI Assistant (Groq) -------------------------------------
# Get a free key at https://console.groq.com/keys. Required for the AI
# Assistant's "Fix Mistakes" and "Build Schedule" features.
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Raw JSON POST bodies can be a few MB (profile pictures are stored as
# base64 data URLs inside the JSON payload, same as the original backend).
server.tomcat.max-swallow-size=5MB
server.tomcat.max-http-form-post-size=5MB

logging.level.com.syllabustracker=INFO
